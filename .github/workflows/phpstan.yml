name: PHPStan

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  pull_request:
  workflow_dispatch: {}

jobs:
  phpstan:
    name: 'PHPStan'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Composer dependencies
        uses: "ramsey/composer-install@v4"

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2048M --no-progress --error-format=github
